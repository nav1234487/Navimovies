<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NaviMovies – Free Classic Cinema</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0a0a0a; color: #f0e6d3; font-family: 'DM Sans', sans-serif; }
    .app {
      min-height: 100vh;
      background: #0a0a0a;
      background-image:
        radial-gradient(ellipse at 20% 0%, rgba(180,120,40,0.08) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 100%, rgba(120,60,20,0.06) 0%, transparent 60%);
    }
    .header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(10,10,10,0.92);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(180,130,50,0.15);
      padding: 0 2rem;
    }
    .header-inner {
      max-width: 1400px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between;
      gap: 1.5rem; height: 70px;
    }
    .logo { display: flex; align-items: center; gap: 0.6rem; flex-shrink: 0; }
    .logo-icon { font-size: 1.6rem; }
    .logo-text {
      font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: 900;
      background: linear-gradient(135deg, #d4a843 0%, #f0c060 50%, #a07020 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      letter-spacing: -0.02em;
    }
    .logo-sub {
      font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.15em;
      color: rgba(180,130,50,0.6); display: block; margin-top: -4px;
    }
    .search-form { display: flex; align-items: center; flex: 1; max-width: 420px; }
    .search-input {
      flex: 1; background: rgba(255,255,255,0.05);
      border: 1px solid rgba(180,130,50,0.2); border-right: none;
      border-radius: 6px 0 0 6px; padding: 0.55rem 1rem;
      color: #f0e6d3; font-family: 'DM Sans', sans-serif; font-size: 0.9rem; outline: none;
      transition: border-color 0.2s;
    }
    .search-input::placeholder { color: rgba(240,230,211,0.35); }
    .search-input:focus { border-color: rgba(180,130,50,0.5); }
    .search-btn {
      background: rgba(180,130,50,0.85); border: 1px solid rgba(180,130,50,0.4);
      border-radius: 0 6px 6px 0; padding: 0.55rem 1rem;
      color: #0a0a0a; font-size: 0.9rem; cursor: pointer; font-weight: 600;
    }
    .search-btn:hover { background: #d4a843; }
    .hero { padding: 3.5rem 2rem 2rem; max-width: 1400px; margin: 0 auto; }
    .hero-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.2em; color: rgba(180,130,50,0.7); margin-bottom: 0.6rem; }
    .hero-heading { font-family: 'Playfair Display', serif; font-size: clamp(2rem, 5vw, 3.5rem); font-weight: 900; line-height: 1.1; color: #f0e6d3; margin-bottom: 0.8rem; }
    .hero-heading em { font-style: italic; background: linear-gradient(135deg, #d4a843, #f0c060); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .hero-sub { color: rgba(240,230,211,0.55); font-size: 1rem; font-weight: 300; max-width: 500px; }
    .divider { width: 40px; height: 2px; background: linear-gradient(90deg, #d4a843, transparent); margin: 1rem 0 1.5rem; }
    .genre-bar { padding: 0 2rem 1.5rem; max-width: 1400px; margin: 0 auto; }
    .genre-scroll { display: flex; gap: 0.5rem; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
    .genre-scroll::-webkit-scrollbar { display: none; }
    .genre-pill {
      flex-shrink: 0; padding: 0.4rem 1.1rem; border-radius: 50px;
      border: 1px solid rgba(180,130,50,0.2); background: transparent;
      color: rgba(240,230,211,0.6); font-family: 'DM Sans', sans-serif;
      font-size: 0.82rem; cursor: pointer; transition: all 0.2s; white-space: nowrap;
    }
    .genre-pill:hover { border-color: rgba(180,130,50,0.5); color: #f0e6d3; }
    .genre-pill.active { background: rgba(180,130,50,0.85); border-color: transparent; color: #0a0a0a; font-weight: 600; }
    .grid-section { padding: 0 2rem 4rem; max-width: 1400px; margin: 0 auto; }
    .section-meta { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.2rem; }
    .section-title { font-family: 'Playfair Display', serif; font-size: 1.2rem; font-weight: 700; color: #f0e6d3; }
    .section-count { font-size: 0.8rem; color: rgba(240,230,211,0.4); }
    .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 1.2rem; }
    .movie-card { cursor: pointer; transition: transform 0.25s; }
    .movie-card:hover { transform: translateY(-4px); }
    .card-poster {
      position: relative; aspect-ratio: 2/3; border-radius: 8px; overflow: hidden;
      background: #1a1510; border: 1px solid rgba(180,130,50,0.12); margin-bottom: 0.6rem;
    }
    .card-poster img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.3s; }
    .movie-card:hover .card-poster img { transform: scale(1.05); }
    .poster-fallback {
      width: 100%; height: 100%; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 0.5rem; padding: 1rem;
      background: linear-gradient(135deg, #1a1510 0%, #241c10 100%);
    }
    .film-icon { font-size: 2rem; opacity: 0.4; }
    .fallback-title { font-size: 0.72rem; text-align: center; color: rgba(240,230,211,0.4); line-height: 1.3; }
    .card-overlay {
      position: absolute; inset: 0; background: rgba(0,0,0,0.55);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity 0.25s;
    }
    .movie-card:hover .card-overlay { opacity: 1; }
    .play-btn {
      background: rgba(212,168,67,0.9); border: none; border-radius: 50px;
      padding: 0.55rem 1.3rem; color: #0a0a0a; font-weight: 700; font-size: 0.85rem;
      cursor: pointer; font-family: 'DM Sans', sans-serif;
    }
    .year-badge {
      position: absolute; top: 8px; right: 8px;
      background: rgba(0,0,0,0.7); border: 1px solid rgba(180,130,50,0.3);
      border-radius: 4px; padding: 2px 7px; font-size: 0.68rem; color: rgba(180,130,50,0.9);
    }
    .card-title { font-size: 0.82rem; font-weight: 500; color: #f0e6d3; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-creator { font-size: 0.72rem; color: rgba(240,230,211,0.4); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .load-more-wrap { display: flex; justify-content: center; margin-top: 2.5rem; }
    .load-more-btn {
      background: transparent; border: 1px solid rgba(180,130,50,0.4); border-radius: 6px;
      padding: 0.7rem 2.5rem; color: rgba(180,130,50,0.9);
      font-family: 'DM Sans', sans-serif; font-size: 0.9rem; cursor: pointer; transition: all 0.2s;
    }
    .load-more-btn:hover { background: rgba(180,130,50,0.1); border-color: rgba(180,130,50,0.7); }
    .load-more-btn:disabled { opacity: 0.4; cursor: default; }
    .state-box { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 5rem 2rem; gap: 1rem; color: rgba(240,230,211,0.4); }
    .state-icon { font-size: 3rem; opacity: 0.3; }
    .state-msg { font-size: 1rem; text-align: center; }
    .retry-btn { background: rgba(180,130,50,0.2); border: 1px solid rgba(180,130,50,0.4); border-radius: 6px; padding: 0.5rem 1.5rem; color: rgba(180,130,50,0.9); cursor: pointer; font-family: 'DM Sans', sans-serif; }
    .shimmer-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 1.2rem; }
    .shimmer-poster { aspect-ratio: 2/3; border-radius: 8px; background: linear-gradient(90deg, #1a1510 25%, #241c10 50%, #1a1510 75%); background-size: 200% 100%; animation: shimmerBg 1.5s infinite; margin-bottom: 0.6rem; }
    .shimmer-line { height: 10px; border-radius: 4px; background: linear-gradient(90deg, #1a1510 25%, #241c10 50%, #1a1510 75%); background-size: 200% 100%; animation: shimmerBg 1.5s infinite; margin-bottom: 6px; }
    .shimmer-line.short { width: 60%; }
    @keyframes shimmerBg { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.88); z-index: 500;
      display: flex; align-items: center; justify-content: center; padding: 1.5rem;
      backdrop-filter: blur(8px); animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .modal-content {
      background: #111009; border: 1px solid rgba(180,130,50,0.2); border-radius: 12px;
      width: 100%; max-width: 860px; max-height: 90vh; overflow-y: auto;
      animation: slideUp 0.25s ease;
    }
    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .modal-header { display: flex; align-items: flex-start; justify-content: space-between; padding: 1.5rem 1.5rem 1rem; gap: 1rem; }
    .modal-title { font-family: 'Playfair Display', serif; font-size: 1.4rem; font-weight: 700; color: #f0e6d3; line-height: 1.2; }
    .modal-year { display: inline-block; margin-top: 4px; font-size: 0.78rem; color: rgba(180,130,50,0.8); background: rgba(180,130,50,0.1); border: 1px solid rgba(180,130,50,0.2); border-radius: 4px; padding: 2px 8px; }
    .close-btn {
      flex-shrink: 0; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px; width: 34px; height: 34px; color: rgba(240,230,211,0.7);
      cursor: pointer; font-size: 0.9rem; display: flex; align-items: center; justify-content: center;
    }
    .close-btn:hover { background: rgba(255,255,255,0.12); color: #f0e6d3; }
    .video-wrapper { position: relative; padding-top: 56.25%; background: #000; }
    .video-wrapper iframe { position: absolute; inset: 0; width: 100%; height: 100%; }
    .modal-desc { padding: 1.2rem 1.5rem 0; color: rgba(240,230,211,0.55); font-size: 0.88rem; line-height: 1.6; font-weight: 300; }
    .modal-footer { padding: 1rem 1.5rem 1.5rem; }
    .archive-link { color: rgba(180,130,50,0.8); font-size: 0.82rem; text-decoration: none; }
    .archive-link:hover { color: #d4a843; }
    @media (max-width: 600px) {
      .header-inner { gap: 0.8rem; }
      .logo-text { font-size: 1.2rem; }
      .search-form { max-width: unset; }
      .hero { padding: 2rem 1rem 1rem; }
      .genre-bar, .grid-section { padding-left: 1rem; padding-right: 1rem; }
      .movie-grid, .shimmer-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    const GENRES = ["All","Comedy","Drama","Horror","Western","Action","Romance","Mystery","Sci-Fi","Animation"];
    const COLLECTIONS = {
      All: "collection:feature_films",
      Comedy: "collection:feature_films subject:comedy",
      Drama: "collection:feature_films subject:drama",
      Horror: "collection:feature_films subject:horror",
      Western: "collection:feature_films subject:western",
      Action: "collection:feature_films subject:action",
      Romance: "collection:feature_films subject:romance",
      Mystery: "collection:feature_films subject:mystery",
      "Sci-Fi": "collection:feature_films subject:science fiction",
      Animation: "collection:feature_films subject:animation",
    };

    function MovieCard({ movie, onClick }) {
      const [imgError, setImgError] = useState(false);
      const thumb = `https://archive.org/services/img/${movie.identifier}`;
      return (
        <div className="movie-card" onClick={() => onClick(movie)}>
          <div className="card-poster">
            {!imgError ? (
              <img src={thumb} alt={movie.title} onError={() => setImgError(true)} loading="lazy" />
            ) : (
              <div className="poster-fallback">
                <span className="film-icon">🎞</span>
                <span className="fallback-title">{movie.title}</span>
              </div>
            )}
            <div className="card-overlay"><button className="play-btn">▶ Play</button></div>
            {movie.year && <div className="year-badge">{movie.year}</div>}
          </div>
          <div className="card-info">
            <h3 className="card-title">{movie.title}</h3>
            {movie.creator && <p className="card-creator">{Array.isArray(movie.creator) ? movie.creator[0] : movie.creator}</p>}
          </div>
        </div>
      );
    }

    function PlayerModal({ movie, onClose }) {
      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal-content" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <div>
                <h2 className="modal-title">{movie.title}</h2>
                {movie.year && <span className="modal-year">{movie.year}</span>}
              </div>
              <button className="close-btn" onClick={onClose}>✕</button>
            </div>
            <div className="video-wrapper">
              <iframe src={`https://archive.org/embed/${movie.identifier}`} allowFullScreen frameBorder="0" title={movie.title} allow="autoplay; fullscreen" />
            </div>
            {movie.description && (
              <div className="modal-desc">
                <p>{typeof movie.description === "string" ? movie.description.slice(0,300) + (movie.description.length > 300 ? "…" : "") : Array.isArray(movie.description) ? movie.description[0]?.slice(0,300) + "…" : ""}</p>
              </div>
            )}
            <div className="modal-footer">
              <a href={`https://archive.org/details/${movie.identifier}`} target="_blank" rel="noopener noreferrer" className="archive-link">View on Archive.org ↗</a>
            </div>
          </div>
        </div>
      );
    }

    function NaviMovies() {
      const [movies, setMovies] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [selectedGenre, setSelectedGenre] = useState("All");
      const [search, setSearch] = useState("");
      const [searchInput, setSearchInput] = useState("");
      const [selectedMovie, setSelectedMovie] = useState(null);
      const [page, setPage] = useState(1);
      const [hasMore, setHasMore] = useState(true);
      const [loadingMore, setLoadingMore] = useState(false);
      const PAGE_SIZE = 20;

      const fetchMovies = async (genre, query, pageNum, append = false) => {
        if (pageNum === 1) setLoading(true); else setLoadingMore(true);
        setError(null);
        try {
          const base = COLLECTIONS[genre] || COLLECTIONS["All"];
          const q = query ? `(${base}) AND title:(${query})` : base;
          const url = `https://archive.org/advancedsearch.php?q=${encodeURIComponent(q)}&fl[]=identifier,title,year,creator,description,subject&sort[]=downloads+desc&rows=${PAGE_SIZE}&page=${pageNum}&output=json&mediatype=movies`;
          const res = await fetch(url);
          if (!res.ok) throw new Error("Failed");
          const data = await res.json();
          const docs = data?.response?.docs || [];
          setHasMore(docs.length === PAGE_SIZE);
          if (append) setMovies(prev => [...prev, ...docs]); else setMovies(docs);
        } catch(e) {
          setError("Could not load movies. Please try again.");
        } finally {
          setLoading(false); setLoadingMore(false);
        }
      };

      useEffect(() => {
        setPage(1); setMovies([]);
        fetchMovies(selectedGenre, search, 1, false);
      }, [selectedGenre, search]);

      const handleLoadMore = () => {
        const next = page + 1; setPage(next);
        fetchMovies(selectedGenre, search, next, true);
      };

      const handleSearch = (e) => { e.preventDefault(); setSearch(searchInput.trim()); };

      return (
        <>
          <div className="app">
            <header className="header">
              <div className="header-inner">
                <div className="logo">
                  <span className="logo-icon">🎞</span>
                  <div>
                    <span className="logo-text">NaviMovies</span>
                    <span className="logo-sub">navimovies.com · Free Classic Cinema</span>
                  </div>
                </div>
                <form className="search-form" onSubmit={handleSearch}>
                  <input className="search-input" type="text" placeholder="Search movies…" value={searchInput} onChange={e => setSearchInput(e.target.value)} />
                  <button className="search-btn" type="submit">🔍</button>
                </form>
              </div>
            </header>

            <section className="hero">
              <p className="hero-label">100% Free · No Sign-Up · No Ads</p>
              <h1 className="hero-heading">Golden Age<br /><em>Cinema, Unlocked.</em></h1>
              <div className="divider"></div>
              <p className="hero-sub">Thousands of classic films from the public domain — stream free, forever, legally.</p>
            </section>

            <div className="genre-bar">
              <div className="genre-scroll">
                {GENRES.map(g => (
                  <button key={g} className={`genre-pill${selectedGenre === g ? " active" : ""}`} onClick={() => setSelectedGenre(g)}>{g}</button>
                ))}
              </div>
            </div>

            <main className="grid-section">
              <div className="section-meta">
                <h2 className="section-title">{search ? `Results for "${search}"` : selectedGenre === "All" ? "Popular Films" : selectedGenre}</h2>
                {!loading && <span className="section-count">{movies.length} films</span>}
              </div>

              {loading ? (
                <div className="shimmer-grid">
                  {Array.from({length: 20}).map((_,i) => (
                    <div key={i}>
                      <div className="shimmer-poster" />
                      <div className="shimmer-line" />
                      <div className="shimmer-line short" />
                    </div>
                  ))}
                </div>
              ) : error ? (
                <div className="state-box">
                  <span className="state-icon">⚠️</span>
                  <p className="state-msg">{error}</p>
                  <button className="retry-btn" onClick={() => fetchMovies(selectedGenre, search, 1)}>Retry</button>
                </div>
              ) : movies.length === 0 ? (
                <div className="state-box">
                  <span className="state-icon">🎬</span>
                  <p className="state-msg">No films found. Try a different search.</p>
                </div>
              ) : (
                <>
                  <div className="movie-grid">
                    {movies.map(m => <MovieCard key={m.identifier} movie={m} onClick={setSelectedMovie} />)}
                  </div>
                  {hasMore && (
                    <div className="load-more-wrap">
                      <button className="load-more-btn" onClick={handleLoadMore} disabled={loadingMore}>
                        {loadingMore ? "Loading…" : "Load More Films"}
                      </button>
                    </div>
                  )}
                </>
              )}
            </main>
          </div>
          {selectedMovie && <PlayerModal movie={selectedMovie} onClose={() => setSelectedMovie(null)} />}
        </>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<NaviMovies />);
  </script>
</body>
</html>
